site_name: NexusPrism Wiki
site_description: Comprehensive documentation for the NexusPrism Minecraft plugin
site_author: O-Tiger
site_url: https://wiki.nexusheim.com/
repo_url: https://github.com/Tg-TheNexus/NexusWiki
repo_name: Tg-TheNexus/NexusWiki
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Bricolage Grotesque
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: pt
          default: true
          name: Português (BR)
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Início: Home
            Primeiros Passos: Getting Started
            Módulos: Modules
            Core: Core
            Essenciais: Essentials
            Economia: Economy
            Clãs: Clans
            Segurança: Security
            Discord: Discord
            Crystal Defense: Crystal Defense
            Votifier: Votifier
            Sonhos: Dreams
            Events: Events
            MMO: MMO
            Proteções: Protections
            Mobs Personalizados: Custom Mobs
            Crafting Infinito: Infinity Crafting
            Integração Twitch: Twitch Integration
            TAB: TAB
            Chat: Chat
            Hologramas: Holograms
            Traits: Traits
            RNG: RNG
            Caixas: Crates
            Encantamentos: Enchantments
            Armazenamento ME: ME Storage
            Energia: Energy
            Estruturas: Structures
            Web & LGPD: Web & GDPR
            Referência: Reference
            PlaceholderAPI: PlaceholderAPI
            Permissões: Permissions
            Comandos: Commands
            Desenvolvedor: Developer
            Guia da API: API Guide
            Loja: Store
            Histórico: Changelog
        - locale: es
          name: Español
          build: true
          nav_translations:
            Início: Inicio
            Primeiros Passos: Primeros Pasos
            Módulos: Módulos
            Core: Core
            Essenciais: Esenciales
            Economia: Economía
            Clãs: Clanes
            Segurança: Seguridad
            Discord: Discord
            Crystal Defense: Crystal Defense
            Votifier: Votifier
            Sonhos: Sueños
            Events: Events
            MMO: MMO
            Proteções: Protecciones
            Mobs Personalizados: Mobs Personalizados
            Crafting Infinito: Crafteo Infinito
            Integração Twitch: Integración Twitch
            TAB: TAB
            Chat: Chat
            Hologramas: Hologramas
            Traits: Traits
            RNG: RNG
            Caixas: Cofres
            Encantamentos: Encantamientos
            Armazenamento ME: Almacenamiento ME
            Energia: Energía
            Estruturas: Estructuras
            Web & LGPD: Web & RGPD
            Referência: Referencia
            PlaceholderAPI: PlaceholderAPI
            Permissões: Permisos
            Comandos: Comandos
            Desenvolvedor: Desarrollador
            Guia da API: Guía de la API
            Loja: Tienda
            Histórico: Historial

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Tg-TheNexus/NexusWiki
    - icon: fontawesome/brands/discord
      link: https://discord.gg/invite/WgmfqwPcnS

nav:
  - Início: index.md
  - Primeiros Passos: getting-started.md
  - Módulos:
      - modules/index.md
      - Core: modules/core.md
      - Essenciais: modules/essentials.md
      - Economia: modules/economy.md
      - Clãs: modules/clans.md
      - Segurança: modules/security.md
      - Discord: modules/discord.md
      - Crystal Defense: modules/crystal-defense.md
      - Votifier: modules/votifier.md
